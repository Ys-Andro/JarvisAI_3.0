name: JARVIS Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Windows desktop distribution
        shell: pwsh
        run: ./gradlew.bat :desktopApp:createDistributable --stacktrace

      - name: Upload desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-windows
          path: desktopApp/build/compose/binaries/main/app/**
