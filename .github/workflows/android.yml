name: Build Jarvis AI (Android)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and pack installable APK
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK=$APK"
          ls -lh "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E "AndroidManifest.xml|classes.dex" || (echo "APK incompleto o sin manifiesto/dex" && exit 1)
          mkdir -p dist
          cp "$APK" dist/app-debug.apk
          tar -cf dist/jarvis-debug.tar -C dist app-debug.apk
          tar -tf dist/jarvis-debug.tar
          mkdir -p /tmp/apkcheck
          tar -xf dist/jarvis-debug.tar -C /tmp/apkcheck
          unzip -t /tmp/apkcheck/app-debug.apk
          echo "APK listo para instalar"

      - name: Upload Debug APK tar (Backup artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug
          path: dist/jarvis-debug.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: JarvisAI Debug Build #${{ github.run_number }}
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Pack Release APK
        run: |
          if ls app/build/outputs/apk/release/*.apk 1>/dev/null 2>&1; then
            mkdir -p dist-release
            APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
            cp "$APK" dist-release/app-release.apk
            tar -cf dist-release/jarvis-release.tar -C dist-release app-release.apk
          fi

      - name: Upload Release APK tar
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release
          path: dist-release/jarvis-release.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
